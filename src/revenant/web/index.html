<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REVENANT</title>
<script src="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js" integrity="sha384-MLX+7yEEPNEznaIWwQi2pBMODSBP6Qo6BOVpzjFWB0UkfEzEYsvHOo7ISLfcQeiI" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js" integrity="sha384-yxKDWWf0wwdUj/gPeuL11czrnKFQROnLgY8ll7En9NYoXibgg3C6NK/UDHNtUgWJ" crossorigin="anonymous"></script>
<style>
:root{--bg:#f7f7f8;--panel:#fff;--ink:#1b1f24;--muted:#5d6570;--line:#d9dce1;--accent:#8a1c1c;--hi:#c2410c;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--panel:#1b1e23;--ink:#e6e8eb;--muted:#9aa3ad;--line:#2d323a;--accent:#f87171;--hi:#fb923c;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:1.05rem;margin:0 1rem 0 0;letter-spacing:.08em}
header small{color:var(--muted)}
input,select,button{font:inherit;padding:.3rem .5rem;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:.75rem;padding:.75rem;height:calc(100vh - 56px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:auto;min-height:0}
#left{display:flex;flex-direction:column}
#stories .s{padding:.55rem .7rem;border-bottom:1px solid var(--line);cursor:pointer}
#stories .s:hover,#stories .s.active{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.badge{display:inline-block;font-size:11px;padding:0 .35rem;border-radius:3px;border:1px solid var(--line);margin:1px 2px 0 0}
.grade-CONFIRMED,.grade-HIGH{color:var(--ok)}.grade-LOW{color:var(--hi)}
#right{display:grid;grid-template-rows:auto 1fr auto;gap:.75rem;min-height:0}
#timeline{min-height:180px}
#graph{min-height:260px}
#detail{padding:.6rem .8rem;max-height:30vh;overflow:auto;font-size:13px}
#detail code{word-break:break-all;font-size:12px}
.summary{padding:.6rem .8rem;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}
.links a{margin-right:.6rem;color:var(--accent)}
@media (max-width:800px){main{grid-template-columns:1fr;height:auto}#right{grid-template-rows:auto 320px auto}}
</style>
</head>
<body>
<header>
  <h1>REVENANT</h1><small>evidence-graph timeline reconstruction &middot; lab-only</small>
  <span style="flex:1"></span>
  <select id="scenario" aria-label="Synthetic scenario"></select>
  <button id="runScenario">Run scenario</button>
  <input id="path" placeholder="artefact path under evidence root" size="34" aria-label="Artefact path">
  <button id="runPath" class="primary">Analyse path</button>
</header>
<main>
  <section id="left" class="panel">
    <div class="summary" id="summary">No case loaded.</div>
    <div class="summary links" id="links"></div>
    <div id="stories"></div>
  </section>
  <section id="right">
    <div id="timeline" class="panel"></div>
    <div id="graph" class="panel"></div>
    <div id="detail" class="panel">Select a story, then click an event.</div>
  </section>
</main>
<script>
function plural(n, one, many){ return `${n} ${n === 1 ? one : (many || one + "s")}`; }
const $ = s => document.querySelector(s);
let caseData = null, timeline = null, network = null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
async function init() {
  const sc = await api("/api/scenarios");
  $("#scenario").innerHTML = sc.map(s => `<option>${esc(s)}</option>`).join("");
}
async function openCase(meta) {
  caseData = await api(`/api/cases/${meta.id}?top=30`);
  const s = caseData.summary;
  $("#summary").innerHTML = `<b>${esc(meta.name)}</b><br>${plural(s.events, "event")} &middot; ${plural(s.edges, "causal edge")} &middot; ` +
    `${s.corroborations} corroborations &middot; ${plural(s.stories, "story", "stories")} &middot; ${s.indicators} indicators &middot; ` +
    `custody ${s.ledger_ok ? "verified" : "BROKEN"}`;
  $("#links").innerHTML = `<a href="/api/cases/${meta.id}/report.html" target="_blank">report</a>` +
    `<a href="/api/cases/${meta.id}/report.md" target="_blank">markdown</a>` +
    `<a href="/api/cases/${meta.id}/cypher" target="_blank">cypher</a>` +
    `<a href="/api/cases/${meta.id}/custody" target="_blank">custody</a>`;
  $("#stories").innerHTML = caseData.stories.map((st, i) =>
    `<div class="s" data-i="${i}"><b>#${i + 1}</b> suspicion ${st.suspicion.toFixed(2)} &middot; ` +
    `<span class="grade-${st.grade}">${st.grade}</span> (${st.confidence.toFixed(2)})<br>` +
    st.techniques.map(t => `<span class="badge">${esc(t)}</span>`).join("") +
    `<br><small>${plural(st.event_ids.length, "event")} &middot; ${esc(st.hosts.join(", "))}` +
    `${st.tampering_flags.length ? " &middot; tamper flags " + st.tampering_flags.length : ""}</small></div>`).join("")
    || "<div class='summary'>No stories: nothing crossed the suspicion threshold.</div>";
  document.querySelectorAll("#stories .s").forEach(el => el.onclick = () => showStory(+el.dataset.i, el));
  if (caseData.stories.length) showStory(0, document.querySelector("#stories .s"));
}
function showStory(i, el) {
  document.querySelectorAll("#stories .s").forEach(x => x.classList.remove("active"));
  el && el.classList.add("active");
  const st = caseData.stories[i];
  const byId = Object.fromEntries(caseData.events.map(e => [e.id, e]));
  const evs = st.event_ids.map(id => byId[id]).filter(Boolean);
  const label = e => `${e.type}: ${(e.object.split(/[\\/]/).pop() || e.object).slice(0, 40)}`;
  const items = new vis.DataSet(evs.map(e => ({id: e.id, start: e.time, content: esc(label(e)),
    style: e.techniques.length ? "border-color:#c2410c;background:#fed7aa;color:#1b1f24" : ""})));
  if (timeline) timeline.destroy();
  timeline = new vis.Timeline($("#timeline"), items, {stack: true, maxHeight: 260, zoomKey: "ctrlKey"});
  timeline.on("select", p => p.items[0] && detail(byId[p.items[0]]));
  const nodes = new vis.DataSet(evs.map(e => ({id: e.id, label: label(e), shape: "box",
    color: e.techniques.length ? {background: "#fed7aa", border: "#c2410c"} : undefined,
    font: {size: 11}})));
  const edges = new vis.DataSet(st.edges.map((e, k) => ({id: k, from: e.src, to: e.dst, arrows: "to",
    label: e.relation, title: `${e.rule} (conf ${e.confidence}, dt ${e.dt_s}s)`, font: {size: 9}})));
  if (network) network.destroy();
  network = new vis.Network($("#graph"), {nodes, edges}, {layout: {hierarchical: {direction: "LR", sortMethod: "directed"}},
    physics: false, interaction: {hover: true}});
  network.on("click", p => p.nodes[0] && detail(byId[p.nodes[0]]));
  $("#detail").innerHTML = `<b>Story ${esc(st.id)}</b> &middot; stages ${esc(st.stages.join(" → ") || "n/a")}<br>` +
    `confidence breakdown: ${esc(JSON.stringify(st.confidence_breakdown))}<br>` +
    (st.tampering_flags.length ? `<b>tampering:</b><ul>${st.tampering_flags.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : "");
}
function detail(e) {
  if (!e) return;
  $("#detail").innerHTML = `<b>${esc(e.type)}</b> ${esc(e.time)} [${esc(e.host)}]<br>` +
    `<b>${esc(e.actor)}</b> ${esc(e.action)} <i>${esc(e.object)}</i><br>` +
    (e.command_line ? `<code>${esc(e.command_line)}</code><br>` : "") +
    `techniques: ${esc(e.techniques.join(", ") || "none")} &middot; suspicion ${e.suspicion}<br>` +
    `source ${esc(e.source)}/${esc(e.reliability)}` +
    (e.corroborated_by.length ? ` &middot; corroborated by ${esc(e.corroborated_by.join(", "))}` : "") +
    `<br>event <code>${esc(e.id)}</code> sha256 <code>${esc(e.hash)}</code>`;
}
$("#runScenario").onclick = async () => {
  try { await openCase(await api(`/api/cases/scenario/${$("#scenario").value}`, {method: "POST"})); }
  catch (err) { alert(err.message); }
};
$("#runPath").onclick = async () => {
  $("#summary").textContent = "Analysing...";
  try { await openCase(await api("/api/cases/path", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({path: $("#path").value})})); }
  catch (err) { $("#summary").textContent = "Error: " + err.message; }
};
init();
</script>
</body>
</html>
