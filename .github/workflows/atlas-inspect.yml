name: atlas-inspect
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          C=e46096d1947e4f059e73a0ac2b9a9707812fd4bc
          for d in raw_logs paper_experiments; do curl -sSL -o $d-S1.zip https://raw.githubusercontent.com/purseclab/ATLAS/$C/$d/S1.zip; unzip -q -o $d-S1.zip -d $d; done
          find raw_logs paper_experiments -type f | head -80 | xargs ls -l
          for f in $(find raw_logs paper_experiments -type f \( -name '*.txt' -o -name '*.log' -o -name '*.json' -o -name '*.csv' -o -name '*.py' \) | grep -v __MACOSX | head -40); do echo "=== $f"; head -c 1500 "$f"; echo; done
          curl -sSL -o src.py https://raw.githubusercontent.com/purseclab/ATLAS/$C/preprocess.py; cat src.py
          curl -sSL -o gg.py https://raw.githubusercontent.com/purseclab/ATLAS/$C/graph_generator.py; cat gg.py
          curl -sSL -o a.py https://raw.githubusercontent.com/purseclab/ATLAS/$C/atlas.py; cat a.py
