name: atlas-inspect
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          C=e46096d1947e4f059e73a0ac2b9a9707812fd4bc
          mkdir rep
          for d in raw_logs paper_experiments; do curl -sSL -o $d-S1.zip https://raw.githubusercontent.com/purseclab/ATLAS/$C/$d/S1.zip; unzip -q -o $d-S1.zip -d $d; done
          find raw_logs paper_experiments -type f -printf '%s\t%p\n' > rep/listing.tsv
          python3 - <<'PY'
          import os
          out=open('rep/heads.txt','w')
          for root,_,fs in os.walk('.'):
              if not root.startswith(('./raw_logs','./paper_experiments')) or '__MACOSX' in root: continue
              for f in fs:
                  p=os.path.join(root,f)
                  if f.endswith(('.h5','.zip')): continue
                  out.write(f'\n===== {p} ({os.path.getsize(p)} bytes)\n')
                  with open(p,'rb') as fh: out.write(fh.read(3000).decode('utf-8','replace'))
          PY
          cp paper_experiments/S1/*.py rep/ 2>/dev/null
          ls rep
      - uses: actions/upload-artifact@v4
        with: {name: atlas-inspect, path: rep/}
