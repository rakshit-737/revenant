[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revenant"
version = "0.2.0"
description = "Evidence-graph forensic timeline reconstruction with confidence grading (lab-only DFIR)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rakshit" }]
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
evtx = ["python-evtx>=0.8", "defusedxml>=0.7"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
pdf = ["weasyprint>=60"]
neo4j = ["neo4j>=5"]
bench = ["pyyaml>=6", "matplotlib>=3.8"]
dev = ["pytest>=7.0", "httpx>=0.27", "fastapi>=0.110", "pyyaml>=6", "ruff>=0.5"]

[project.scripts]
revenant = "revenant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"revenant.web" = ["*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["realdata: needs the downloaded public datasets (skipped when absent)"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905", "UP007"]

[tool.ruff.lint.per-file-ignores]
"src/revenant/attack.py" = ["E501"]  # one ATT&CK heuristic per line, regexes kept whole
